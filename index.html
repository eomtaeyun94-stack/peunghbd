<!doctype html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="theme-color" content="#10061f" />
  <title>Happy Birthday ✦</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=DM+Serif+Display:ital@0;1&family=Pretendard:wght@400;500;600;700&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <main class="celebration">
    <div class="aurora aurora-one"></div>
    <div class="aurora aurora-two"></div>
    <div class="grain"></div>

    <section class="card" aria-labelledby="birthday-title">
      <span class="eyebrow">A DAY MADE TO SHINE</span>
      <p class="sparkle" aria-hidden="true">✦</p>
      <h1 id="birthday-title">Happy<br /><em>Birthday</em></h1>
      <p class="message">오늘의 주인공에게,<br />가장 찬란하고 행복한 순간들만 가득하길.</p>
      <div class="divider"><span></span> ✦ <span></span></div>
      <p class="signature">WITH ALL MY LOVE</p>
    </section>

    <p class="footer-note">MAKE A WISH · IT'S YOUR MOMENT</p>
  </main>
</body>
</html>
